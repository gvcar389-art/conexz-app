<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a1a;
        }
        .icon {
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #00d4ff, #6C63FF);
            border-radius: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3);
            padding: 40px;
        }
        .icon .cloud {
            font-size: 80px;
            color: rgba(255,255,255,0.15);
            position: absolute;
            margin-top: -80px;
        }
        .icon .title {
            font-family: Arial, sans-serif;
            font-size: 140px;
            font-weight: 900;
            color: white;
            letter-spacing: 8px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .icon .subtitle {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: 400;
            color: rgba(255,255,255,0.7);
            margin-top: 10px;
            letter-spacing: 6px;
        }
        .icon .arrow {
            font-size: 40px;
            color: rgba(255,255,255,0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="icon">
        <div class="cloud">☁️</div>
        <div class="title">CZ</div>
        <div class="subtitle">CONEXZ</div>
        <div class="arrow">⟷</div>
    </div>
</body>
</html>
